@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4 overflow-hidden font-sans">
    <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-2xl animate-fade-in">
      <!-- Icon & Title -->
      <div class="flex items-center gap-4">
        <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-red-500/10 border border-red-500/20 text-red-500">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <div>
          <h3 class="text-lg font-bold text-white tracking-tight">{{ title() }}</h3>
          <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Destructive Action</p>
        </div>
      </div>

      <!-- Message Area -->
      <div class="mt-4">
        <p class="text-sm text-slate-300 leading-relaxed">
          {{ message() }}
        </p>
        @if (itemName()) {
          <div class="mt-3 rounded-lg bg-slate-950 border border-slate-850 p-3">
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Target Item:</span>
            <p class="mt-0.5 text-sm font-bold text-red-400 font-mono break-all select-all">{{ itemName() }}</p>
          </div>
        }
      </div>

      <!-- Action Buttons -->
      <div class="mt-6 flex justify-end gap-3">
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="isDeleting()"
          class="rounded-lg border border-slate-800 bg-slate-900 px-4 py-2 text-xs font-semibold text-slate-300 hover:bg-slate-850 hover:text-white transition-all disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          [disabled]="isDeleting()"
          class="flex items-center gap-2 rounded-lg bg-red-600 px-4 py-2 text-xs font-semibold text-white shadow-md shadow-red-600/10 hover:bg-red-500 hover:shadow-red-500/20 active:bg-red-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
        >
          @if (isDeleting()) {
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Deleting...</span>
          } @else {
            <span>Confirm Delete</span>
          }
        </button>
      </div>
    </div>
  </div>
}
