<div class="space-y-1.5 font-sans">
  @if (label()) {
    <label
      [for]="id()"
      [class]="isInvalid 
        ? 'text-[10px] font-bold text-red-400 uppercase tracking-wider' 
        : 'text-[10px] font-bold text-slate-400 uppercase tracking-wider'"
    >
      {{ label() }}
    </label>
  }
  <div class="relative">
    <input
      [id]="id()"
      [type]="type()"
      [formControl]="control()"
      [placeholder]="placeholder()"
      [class]="isInvalid
        ? 'w-full rounded-lg bg-slate-950 border border-red-500/50 px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition-all font-medium'
        : 'w-full rounded-lg bg-slate-950 border border-slate-850 px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all font-medium'"
    />
  </div>
  @if (isInvalid) {
    <p class="text-[10px] text-red-400 font-medium tracking-wide">
      {{ errorMessage }}
    </p>
  }
</div>
