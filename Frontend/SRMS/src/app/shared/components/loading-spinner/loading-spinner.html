<div
  [class]="overlay() 
    ? 'fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/70 backdrop-blur-sm' 
    : 'flex flex-col items-center justify-center p-4'"
>
  <div class="flex flex-col items-center gap-3">
    <!-- Spinning SVG Circle -->
    <svg
      [class]="'animate-spin text-indigo-500 ' + 
        (size() === 'sm' ? 'h-6 w-6' : '') +
        (size() === 'md' ? 'h-10 w-10' : '') +
        (size() === 'lg' ? 'h-16 w-16' : '')"
      fill="none"
      viewBox="0 0 24 24"
    >
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>

    <!-- Optional Loading Message -->
    @if (message()) {
      <p [class]="'font-semibold text-slate-400 tracking-wide ' + (size() === 'sm' ? 'text-[10px] uppercase' : 'text-xs')">
        {{ message() }}
      </p>
    }
  </div>
</div>
