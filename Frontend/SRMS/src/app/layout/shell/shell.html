<div class="flex min-h-screen flex-col bg-slate-950 text-slate-100 antialiased font-sans">
  <!-- Top Navbar -->
  <app-navbar></app-navbar>

  <div class="flex flex-1">
    <!-- Sidebar Navigation -->
    <app-sidebar [activeRole]="activeRole()"></app-sidebar>

    <!-- Main Dynamic Content Area -->
    <main class="flex-1 overflow-y-auto p-6 md:p-8">
      <div class="mx-auto max-w-7xl">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <!-- Floating Forbidden Warning Banner (Auto-dismisses in 5s) -->
  @if (forbiddenError()) {
    <div class="fixed bottom-6 right-6 z-50 max-w-md animate-fade-in rounded-2xl border border-red-500/30 bg-red-950/80 p-4 shadow-2xl backdrop-blur-md text-white transition-all duration-300">
      <div class="flex items-start gap-3">
        <div class="rounded-full bg-red-500/10 border border-red-500/20 p-1.5 text-red-400">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <div>
          <h4 class="text-sm font-bold tracking-tight">Access Denied (403)</h4>
          <p class="mt-1 text-xs text-red-300 leading-normal">{{ forbiddenError() }}</p>
        </div>
      </div>
    </div>
  }

  <!-- Toast Notification Overlay Container -->
  <app-toast></app-toast>
</div>
