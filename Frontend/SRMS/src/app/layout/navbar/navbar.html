<header class="sticky top-0 z-40 w-full border-b border-slate-800 bg-slate-900/80 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <!-- Brand / Logo -->
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 shadow-lg shadow-indigo-500/25">
        <span class="font-bold text-white text-lg tracking-wider">SR</span>
      </div>
      <div>
        <h1 class="text-lg font-bold text-white tracking-tight">SRMS</h1>
        <p class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Result Portal</p>
      </div>
    </div>

    <!-- Right Side Actions (Role Badge, User Profile & Logout) -->
    <div class="flex items-center gap-4">
      @if (currentUser()) {
        <!-- Role Badge -->
        <span class="rounded-full bg-indigo-500/10 border border-indigo-500/20 px-3 py-1 text-xs font-semibold text-indigo-400">
          {{ activeRole() }} Portal
        </span>

        <!-- Vertical Divider -->
        <div class="h-6 w-px bg-slate-800"></div>

        <!-- User Information -->
        <div class="flex items-center gap-3">
          <div class="hidden sm:block text-right">
            <p class="text-sm font-semibold text-white">{{ currentUser()?.name }}</p>
            <p class="text-[10px] text-slate-400">{{ currentUser()?.email }}</p>
          </div>
          <div class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-800 border border-slate-700 text-white font-bold text-sm shadow-inner uppercase">
            {{ currentUser()?.name?.substring(0, 2) || 'US' }}
          </div>
        </div>

        <!-- Vertical Divider -->
        <div class="h-6 w-px bg-slate-800"></div>

        <!-- Logout Button -->
        <button
          (click)="logout()"
          title="Sign Out"
          class="flex items-center gap-2 rounded-lg bg-slate-950 border border-slate-800 px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-red-400 hover:border-red-500/30 hover:bg-red-500/10 transition-all duration-200 cursor-pointer"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span class="hidden md:inline">Sign Out</span>
        </button>
      } @else {
        <span class="rounded-full bg-slate-800 border border-slate-700 px-3 py-1 text-xs font-semibold text-slate-450">
          Not Authenticated
        </span>
      }
    </div>
  </div>
</header>
